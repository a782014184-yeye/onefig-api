# OneFig CSP 片段（2026-10-19，P1-07/N10）
# 只 include 在「面向公众的 HTML 页面」location（location /、SPA 回退、/m/、/s/、/index.html、/404.html）
# 切勿 include 进：/qianwanfuweng /console/（后台页有大量内联 onclick/script，会被 script-src 卡死）、
# /canvas-lab/（画板 index.html 有 1 个内联 boot script）、/api/（JSON 接口无意义）
# 排障：页面空白先看控制台 CSP 报错，确认是哪个指令拦的再放宽，不要直接删整条
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
