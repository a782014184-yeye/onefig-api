# OneFig nginx 配置（onefig.cn）
# 版本：2026-10-18 v3 —— 修 P0-1：未知路径真 404（静态 404 页），SPA 路由白名单回退，不再一律回退首页外壳
# 服务器路径：/etc/nginx/conf.d/onefig.conf（本文件为其仓库副本，改动需同步部署）
# 安全头片段：/etc/nginx/onefig-security-headers.conf
#   注意 nginx 规则：location 块一旦有自己的 add_header，就不再继承 server 级的，
#   所以凡带自定义 add_header 的块都必须 include 该片段。

server {
    listen 443 ssl;
    server_name onefig.cn www.onefig.cn;
    ssl_certificate /etc/nginx/onefig.pem;
    ssl_certificate_key /etc/nginx/onefig.key;
    root /opt/onefig-web;
    index index.html;
    client_max_body_size 50m;

    # ---- gzip 压缩（JS/CSS/JSON/SVG/字体，含反代响应）----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    # ---- 安全响应头（always 确保反代响应也带上）----
    include /etc/nginx/onefig-security-headers.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /qianwanfuweng {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /console/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO：sitemap 与素材/系列落地页由后端实时直出（2026-10-08）
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /m/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /s/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 素材预览图：画板测试端(canvas-lab)跨域加载需要 CORS 头（2026-09-26）
    # ^~ 阻止下面的图片正则规则覆盖本块（CORS 头不能丢）
    location ^~ /previews/ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Cache-Control "public, max-age=604800" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    # 画板构建产物（带内容哈希）：长缓存
    location ^~ /canvas-lab/assets/ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 画板（canvas-lab 独立子应用）：html 不缓存，发版即生效；缺失文件直接 404，
    # 不要回退到主站 index.html（否则画板资源缺失时会渲染成主站空壳）
    location ^~ /canvas-lab/ {
        include /etc/nginx/onefig-security-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # 主站构建产物（Vite 带内容哈希）：长缓存一年，内容变哈希变即自动更新
    location ^~ /assets/ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html 不缓存：保证发版后用户立即拿到新版本入口
    location = /index.html {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 静态 404 页（2026-10-18，修 P0-1 白屏/软404）：仅作 error_page 内部跳转，
    # internal 使外部直接访问 /404.html 也返回 404，避免软 404 被收录
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    # SPA 前端路由（仅未做预渲染的私密/工具页，与 sci-graphics-hub/src/App.tsx 路由表保持同步）：
    # 回退到主站入口由 React 渲染。已预渲染的公开页（/materials /pricing /ai /request /custom
    # /verify /terms /privacy /license /certificate）由 location / 直接出静态 HTML，不走此回退——
    # 否则搜索引擎拿到的会变成首页外壳而不是对应页的预渲染内容。
    location ~ ^/(account|downloads|progress|boards|pay|wechat-pay|login|register|admin|pricing-admin)/?$ {
        try_files /index.html =404;
    }

    # 分享画板：/share/:token
    location ~ ^/share/[^/]+/?$ {
        try_files /index.html =404;
    }

    # 站点根目录下的静态图片/图标/字体：缓存一周
    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 其余路径：文件存在则返回，不存在返回真 404（修 P0-1：不再 200 + 首页外壳 → 白屏）
    location / {
        try_files $uri $uri/ =404;
    }
}
server {
    listen 80;
    server_name onefig.cn www.onefig.cn;
    return 301 https://onefig.cn$request_uri;
}
