# OneFig nginx 配置（onefig.cn）
# 版本：2026-10-19 v7 —— 所有 HTML 响应补 Cache-Control: no-cache（修 Safari 缓存旧 HTML 引用已删除的
#   构建产物导致裸奔页面的问题；以前只有 /index.html 有 no-cache，预渲染页和 SPA 回退都没有）
# 历史：v6 charset+CSP / v5 www 归一 / v4 后台 Basic Auth / v3 真 404
# 服务器路径：/etc/nginx/conf.d/onefig.conf（本文件为其仓库副本，改动需同步部署）
# 安全头片段：/etc/nginx/onefig-security-headers.conf
# CSP 片段：/etc/nginx/onefig-csp.conf —— 只挂公众 HTML 页面 location，切勿挂后台/画板/API
#   注意 nginx 规则：location 块一旦有自己的 add_header，就不再继承 server 级的，
#   所以凡带自定义 add_header（含 CSP）的块都必须 include 安全头片段。

server {
    listen 443 ssl;
    server_name onefig.cn;
    ssl_certificate /etc/nginx/onefig.pem;
    ssl_certificate_key /etc/nginx/onefig.key;
    root /opt/onefig-web;
    index index.html;
    client_max_body_size 50m;
    charset utf-8;  # P1-09：HTML 响应头补 charset（原来只有页面内 meta 兜底）

    # ---- gzip 压缩（JS/CSS/JSON/SVG/字体，含反代响应）----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    # ---- 安全响应头（always 确保反代响应也带上）----
    include /etc/nginx/onefig-security-headers.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 2026-10-19：必须 ^~——否则 .jpg 等请求会被下方图片正则 location 抢走去前端目录找，永远 404
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-10-19：后台老接口（toggle/delete 走 /qianwanfuweng/ 前缀）摘除 Basic Auth——
    # 页面内 XHR/POST 带不了弹窗凭据，会触发 401 挑战导致弹窗循环；
    # 精确匹配优先于下方前缀 location，应用层由 consoleAuth（Bearer）保护
    location = /qianwanfuweng/toggle {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /qianwanfuweng/delete {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台入口（issue-02，2026-10-18）：Basic Auth 密码弹窗，密码文件只留服务器，不进 git
    location /qianwanfuweng {
        auth_basic "OneFig Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-onefig;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-10-19：console API 摘除 Basic Auth——页面加载后 XHR 带不了弹窗凭据，
    # 导致数据看板卡「加载中」+ 弹窗无限循环；本层已由后端 Bearer token（consoleAuth）
    # 和登录限流（10次/10分钟）保护，Basic Auth 只保留在后台页面入口 /qianwanfuweng
    location /console/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO：sitemap 与素材/系列落地页由后端实时直出（2026-10-08）
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /m/ {
        include /etc/nginx/onefig-csp.conf;
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;  # HTML 不缓存（v7）
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /s/ {
        include /etc/nginx/onefig-csp.conf;
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;  # HTML 不缓存（v7）
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 素材预览图：画板测试端(canvas-lab)跨域加载需要 CORS 头（2026-09-26）
    # ^~ 阻止下面的图片正则规则覆盖本块（CORS 头不能丢）
    location ^~ /previews/ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Cache-Control "public, max-age=604800" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }

    # 画板构建产物（带内容哈希）：长缓存
    location ^~ /canvas-lab/assets/ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 画板（canvas-lab 独立子应用）：html 不缓存，发版即生效；缺失文件直接 404，
    # 不要回退到主站 index.html（否则画板资源缺失时会渲染成主站空壳）
    location ^~ /canvas-lab/ {
        include /etc/nginx/onefig-security-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # 主站构建产物（Vite 带内容哈希）：长缓存一年，内容变哈希变即自动更新
    location ^~ /assets/ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html 不缓存：保证发版后用户立即拿到新版本入口
    location = /index.html {
        include /etc/nginx/onefig-csp.conf;
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 静态 404 页（2026-10-18，修 P0-1 白屏/软404）：仅作 error_page 内部跳转，
    # internal 使外部直接访问 /404.html 也返回 404，避免软 404 被收录
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/onefig-csp.conf;
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    # SPA 前端路由（仅未做预渲染的私密/工具页，与 sci-graphics-hub/src/App.tsx 路由表保持同步）：
    # 回退到主站入口由 React 渲染。已预渲染的公开页（/materials /pricing /ai /request /custom
    # /verify /terms /privacy /license /certificate）由 location / 直接出静态 HTML，不走此回退——
    # 否则搜索引擎拿到的会变成首页外壳而不是对应页的预渲染内容。
    location ~ ^/(account|invoices|downloads|progress|boards|pay|wechat-pay|login|register)/?$ {
        include /etc/nginx/onefig-csp.conf;
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;  # HTML 不缓存（v7）
        try_files /index.html =404;
    }

    # SPA 后台路由（/admin、/pricing-admin）：同样挂 Basic Auth（issue-02）
    location ~ ^/(admin|pricing-admin)/?$ {
        auth_basic "OneFig Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-onefig;
        try_files /index.html =404;
    }

    # 分享画板：/share/:token
    location ~ ^/share/[^/]+/?$ {
        include /etc/nginx/onefig-csp.conf;
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;  # HTML 不缓存（v7）
        try_files /index.html =404;
    }

    # 站点根目录下的静态图片/图标/字体：缓存一周
    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 其余路径：文件存在则返回，不存在返回真 404（修 P0-1：不再 200 + 首页外壳 → 白屏）
    # no-cache（v7）：预渲染 HTML 必须每次回源校验，否则旧 HTML 引用已删除的哈希资产会裸奔
    location / {
        include /etc/nginx/onefig-csp.conf;
        include /etc/nginx/onefig-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
server {
    listen 80;
    server_name onefig.cn www.onefig.cn;
    return 301 https://onefig.cn$request_uri;
}

# www 归一到裸域（issue-03，2026-10-18）：https://www.onefig.cn 一律 301 到 https://onefig.cn
# 证书与主站同一张（泛域名/双域名证书），仅做跳转不 serving 内容
server {
    listen 443 ssl;
    server_name www.onefig.cn;
    ssl_certificate /etc/nginx/onefig.pem;
    ssl_certificate_key /etc/nginx/onefig.key;
    return 301 https://onefig.cn$request_uri;
}
